<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log In — Local Marketplace</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-logo">
      <a href="/">🛒 Local Marketplace</a>
    </div>
    <h2>Welcome back!</h2>
    <p class="auth-sub">Log in to your account</p>

    <div id="auth-error" class="auth-error" style="display:none;"></div>

    <form id="login-form" novalidate>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input type="email" id="email" placeholder="juan@email.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password <span class="required">*</span></label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <button type="submit" class="btn-submit" data-label="Log In">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/pages/register.html">Sign up</a></p>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
