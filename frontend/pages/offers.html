<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offers — Local Marketplace</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/offers.css"/>
</head>
<body>

  <header class="main-header">
    <div class="header-inner">
      <a href="/" class="logo">🛒 Local Marketplace</a>
      <nav id="main-nav"></nav>
    </div>
  </header>

  <div class="offers-page">
    <h1>💰 Offers & Negotiations</h1>
    <p class="page-sub">Manage offers you've received from buyers and offers you've sent to sellers.</p>

    <!-- Tabs -->
    <div class="offers-tabs">
      <button class="offers-tab active" id="tab-received" onclick="switchTab('received')">
        📥 Received
        <span class="tab-count pending" id="received-count" style="display:none;"></span>
      </button>
      <button class="offers-tab" id="tab-sent" onclick="switchTab('sent')">
        📤 Sent
        <span class="tab-count" id="sent-count" style="display:none;"></span>
      </button>
    </div>

    <!-- Filter row -->
    <div style="display:flex;gap:0.75rem;margin-bottom:1.25rem;flex-wrap:wrap;">
      <select id="status-filter" onchange="loadOffers()" style="padding:0.5rem 0.85rem;border:1px solid #e5e7eb;border-radius:8px;font-size:0.9rem;outline:none;">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="countered">Countered</option>
        <option value="accepted">Accepted</option>
        <option value="declined">Declined</option>
        <option value="withdrawn">Withdrawn</option>
      </select>
    </div>

    <!-- Offers list -->
    <div id="offers-list">
      <p style="color:#94a3b8;">Loading offers...</p>
    </div>

    <!-- Pagination -->
    <div id="offers-pagination" style="display:flex;justify-content:center;gap:0.5rem;margin-top:1.5rem;"></div>
  </div>

  <script src="/js/main.js"></script>
  <script src="/js/offers.js"></script>
</body>
</html>
