<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports — Admin Panel</title>
  <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="admin-body">
  <aside class="admin-sidebar" id="admin-sidebar"></aside>
  <div class="admin-main">
    <div class="admin-topbar">
      <h1>📋 User Reports</h1>
      <span id="ar-count" style="color:#94a3b8;font-size:0.9rem;"></span>
    </div>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-toolbar">
          <div class="toolbar-filter">
            <select id="ar-status">
              <option value="pending">Pending</option>
              <option value="">All Reports</option>
              <option value="reviewed">Reviewed</option>
              <option value="resolved">Resolved</option>
              <option value="dismissed">Dismissed</option>
            </select>
          </div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Reason</th>
                <th>Reporter</th>
                <th>Against</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="admin-reports-table">
              <tr><td colspan="6" style="text-align:center;padding:2rem;color:#94a3b8;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="admin-pagination" id="ar-pagination"></div>
      </div>
    </div>
  </div>
  <script src="/js/admin.js"></script>
</body>
</html>
